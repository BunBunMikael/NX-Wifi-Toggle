name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libtesla
        run: git clone --depth 1 https://github.com/WerWolv/libtesla libtesla

      - name: Build overlay
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: nowifi-ovl
          path: nowifi.ovl
